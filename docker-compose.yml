services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unicrypt
      POSTGRES_USER: unicrypt
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      SECRET_KEY: replace-with-long-random-secret
      DATABASE_URL: postgresql+psycopg://unicrypt:change-me@db:5432/unicrypt
      COOKIE_SECURE: "false"
    depends_on:
      - db
volumes:
  postgres_data:
